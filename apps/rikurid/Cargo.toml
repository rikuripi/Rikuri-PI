[package]
name = "rikurid"
version = "0.1.0"
description = "Rikuri Pi trusted daemon: the only writer of canonical state, serving the versioned envelope on a local socket"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test builds only: lets a harness stop the daemon at a named crash point
# (RIKURI_CRASH_AT) so it can be killed with SIGKILL there, and lets the
# T00.08 regression switch idempotency off. A build with this feature
# reports itself Degraded in system.health.
crash-injection = []

[dependencies]
rikuri-api.workspace = true
rikuri-domain.workspace = true
rikuri-ledger.workspace = true
rikuri-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
rikuri-testkit.workspace = true
proptest.workspace = true
tempfile.workspace = true

# T00.07/T00.08/T00.12 drive a crash-injection daemon; the full gate's
# crash-matrix step runs it (cargo test --features crash-injection
# --target-dir target/crash-injection, so the test build never replaces the
# production target/debug/rikurid).
[[test]]
name = "crash_matrix"
required-features = ["crash-injection"]

[lints]
workspace = true
