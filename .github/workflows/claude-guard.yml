name: AI-session guard

# AGENTS.md > Deterministic gates. The PreToolUse hook that enforces
# secrets / git / protected-path / GitHub-gate / fix-lock policy on AI
# sessions is code, so it is gated like code. The Stage 00 full gate
# (ci.yml) runs the same unit tests on Ubuntu; this workflow adds the macOS
# system Python (3.9), so a guard change is checked on both interpreters.

on:
  push:
    branches: [main]
    paths: ['.claude/**', '.github/workflows/claude-guard.yml']
  pull_request:
    branches: [main]
    paths: ['.claude/**', '.github/workflows/claude-guard.yml']

permissions:
  contents: read

jobs:
  guard:
    name: Guard policy tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        # 3.9 is the macOS system Python; 3.12 is Ubuntu 24.04's.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Guard wired in .claude/settings.json
        run: grep -q 'guard.py' .claude/settings.json
      - name: Every config example + generic cases + failure modes
        run: python -m unittest discover -s .claude/hooks -p 'test_*.py' -v
