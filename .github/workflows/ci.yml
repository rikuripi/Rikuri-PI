name: CI

# Stage Plan S00.02. The Ubuntu job runs scripts/quality/full-gate.sh, the
# same script developers run (README > Running the full gate), so CI and local
# results cannot drift: pinned tools → gate self-tests → guard tests →
# format → build → clippy → unit/contract tests → smoke → crash matrix →
# dependency policy → secret scan → ratchet → module contracts → crate policy
# → scrap sweep (15 steps). No step uses continue-on-error.
#
# macOS runs the platform-neutral core build/unit/contract checks and the
# crash matrix (SQLite recovery after SIGKILL is platform-neutral; the job
# keeps its original name so its check history stays continuous) on every
# merge to main, not on PRs (owner decision 2026-10-05; continuous macOS core
# checks per ADR 0000). A red macOS run on main stops the line. It runs on the
# owner's Mac as a self-hosted runner, not GitHub's billed macOS machines
# (owner decision 2026-10-06; setup in README > macOS runner). If the Mac is
# offline the job waits as queued, and GitHub fails it after 24 hours.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-gate:
    name: Full gate (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the branch's full history
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - name: Install cargo-deny 0.20.2 (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tgz" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Full gate
        run: scripts/quality/full-gate.sh

  macos-core:
    name: macOS core (build · unit · contract)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          command -v rustup >/dev/null || {
            echo "::error::rustup is not installed for the runner user (expected in ~/.cargo/bin; README > macOS runner)"
            exit 1
          }
          rustup toolchain install && rustc --version
      # This runner keeps its files between jobs. With cache-bin (the default),
      # the cache action's cleanup deleted rustup, the only regular file in
      # ~/.cargo/bin, leaving the cargo and rustc proxy links dangling, after
      # the first green run, so every later job failed (2026-10-06, run
      # 37564819464). The toolchain stays installed on the Mac instead.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Through the gate's wrapper, as on Ubuntu: a private TMPDIR that must
      # stay empty. This runner keeps its files, so leaks would pile up here.
      - name: Unit and contract tests
        run: scripts/quality/no-temp-residue.sh cargo test --workspace --locked
      - name: Crash matrix (W1; SQLite recovery after SIGKILL is platform-neutral core)
        run: cargo test -p rikurid --features crash-injection --test crash_matrix --locked --target-dir target/crash-injection
