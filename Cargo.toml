# Rikuri Pi Foundation-0 workspace (Stage Plan S00.01).
# Layout follows Architecture §45: crates/ hold the protected core; apps/
# (rikurid, rikuri-cli) are added when they exist. No empty future crates.

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ulid = "3.0.0"
proptest = "1.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
blake3 = "1.8.7"
rikuri-domain = { path = "crates/rikuri-domain" }
rikuri-storage = { path = "crates/rikuri-storage" }
rikuri-ledger = { path = "crates/rikuri-ledger" }
rikuri-api = { path = "crates/rikuri-api" }
rikuri-testkit = { path = "crates/rikuri-testkit" }
rikurid = { path = "apps/rikurid" }
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Panicking shortcuts and debug output are build failures in shipped code.
# clippy.toml allows unwrap/expect inside tests only.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
